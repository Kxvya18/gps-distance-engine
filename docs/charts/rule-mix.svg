<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" width="760" height="234" role="img"><title>A tiny share of segments carries the expensive kilometres</title><desc>Routed segments are 0.14 percent of segments and 23.4 percent of kilometres.</desc><style>
svg{--bg:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--grid:#e6e5e0;--axis:#b9b8b0;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--t1:#f0efec;--t2:#c3c2b7;--grid:#333331;--axis:#5c5b55;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
.bg{fill:var(--bg)}.ti{fill:var(--t1);font-size:16px;font-weight:600}.su{fill:var(--t2);font-size:12.5px}.tx{fill:var(--t2);font-size:12px}.va{fill:var(--t1);font-size:12px;font-weight:600}.gr{stroke:var(--grid);stroke-width:1}.ax{stroke:var(--axis);stroke-width:1}
</style><rect class="bg" width="760" height="234" rx="10"/><text class="ti" x="24" y="32">A tiny share of segments carries the expensive kilometres</text><text class="su" x="24" y="52">All 14.6M segments and 348,502 km across 10,000 trips.</text><rect x="24" y="68" width="12" height="12" rx="3" fill="var(--s1)"/><text class="tx" x="42" y="78">Straight line, short and parked</text><rect x="264.79999999999995" y="68" width="12" height="12" rx="3" fill="var(--s2)"/><text class="tx" x="282.79999999999995" y="78">Road distance from the provider</text><text class="tx" x="138" y="120" text-anchor="end">Share of segments</text><rect x="150" y="100" width="575.0" height="30" rx="4" fill="var(--s1)"/><rect x="727.0" y="100" width="3.0" height="30" rx="4" fill="var(--s2)"/><text class="va" x="730" y="147" text-anchor="end">0.14% from the provider</text><text class="tx" x="138" y="182" text-anchor="end">Share of kilometres</text><rect x="150" y="162" width="442.2" height="30" rx="4" fill="var(--s1)"/><rect x="594.2" y="162" width="135.8" height="30" rx="4" fill="var(--s2)"/><text class="va" x="730" y="209" text-anchor="end">23.41% from the provider</text></svg>