spring:
  application:
    name: gps-distance-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/distance}
    username: ${DB_USER:distance}
    password: ${DB_PASSWORD:distance}
    hikari:
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  structured:
    format:
      console: ecs

app:
  jwt-secret: ${JWT_SECRET}
  demo-password: ${DEMO_PASSWORD}
  provider-latency-millis: 20
  recompute-delay-millis: 5000
  rules:
    version: 1
    max-speed-kmh: 120
    max-accuracy-meters: 50
    short-gap-seconds: 70
    parked-speed-kmh: 5
    max-route-meters: 100000
    road-factor: 1.4
    office-radius-meters: 400
    include-no-shows: false
